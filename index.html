<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crazy Gamers</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
}

header {
    background: #16a34a;
    padding: 30px 20px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 36px;
}

header p {
    margin-top: 8px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #1f2937;
    padding: 20px;
    margin: 20px 0;
    border-radius: 15px;
}

.players {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
}

.player {
    background: #374151;
    padding: 20px;
    text-align: center;
    border-radius: 12px;
}

.player h3 {
    margin: 5px 0;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #4b5563;
}

th {
    background: #16a34a;
}

footer {
    text-align: center;
    padding: 20px;
    color: #9ca3af;
}
</style>
</head>

<body>

<header>
    <h1>🎮 CRAZY GAMERS</h1>
    <p>eFootball Tournament Hub</p>
</header>

<div class="container">

    <div class="card">
        <h2>👥 Current Players</h2>

        <div class="players">

            <div class="player">
                <h3>Pharis</h3>
                <p>Player</p>
            </div>

            <div class="player">
                <h3>Alvin</h3>
                <p>Player</p>
            </div>

            <div class="player">
                <h3>Njoga</h3>
                <p>Player</p>
            </div>

        </div>
    </div>

    <div class="card">
        <h2>🏆 Tournament Standings</h2>

        <table>
            <tr>
                <th>Player</th>
                <th>Played</th>
                <th>Wins</th>
                <th>Points</th>
            </tr>

            <tr>
                <td>Pharis</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
            </tr>

            <tr>
                <td>Alvin</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
            </tr>

            <tr>
                <td>Njoga</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
            </tr>
        </table>
    </div>

    <div class="card">
        <h2>⚽ Latest Results</h2>
        <p>No matches recorded yet.</p>
    </div>

</div>

<footer>
    © 2026 Crazy Gamers
</footer>

</body>
</html>
